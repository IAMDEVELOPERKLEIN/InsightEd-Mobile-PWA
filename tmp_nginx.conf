user www-data;
worker_processes auto;
worker_rlimit_nofile 65535; # Aggressive limit for massive concurrency
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 32768; # Aggressive ceiling
    multi_accept on;
    use epoll;
}

http {
    # Virtual hosts (includes upstream definitions from stride.conf)
    include /etc/nginx/sites-enabled/*;

    ##
    # Basic Settings
    ##
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  30; # Reduced from 65 for faster resource cycling
    keepalive_requests 1000; # Allow more requests per connection
    reset_timedout_connection on; # Immediately free up memory for timed-out sockets
    types_hash_max_size 2048;
    server_tokens      off;

    # WebSocket / keepalive connection header map
    # '' -> "" lets upstream keepalive work on plain HTTP connections;
    # any Upgrade value (e.g. "websocket") -> "upgrade" keeps WS alive.
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       "";
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # SSL Settings
    ##
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    ##
    # Proxy Cache — Binary Assets (GET /api/asset/:id)
    # 500 MB max on-disk; entries expire after 30 min of inactivity.
    ##
    proxy_cache_path /var/cache/nginx/binary_cache
                     levels=1:2
                     keys_zone=binary_cache:10m
                     max_size=500m
                     inactive=30m
                     use_temp_path=off;

    ##
    # Proxy Buffers — tuned for large binary transfers (PDFs, images)
    ##
    proxy_buffers              4 256k;
    proxy_buffer_size          128k;
    proxy_busy_buffers_size    256k;
    proxy_temp_file_write_size 256k;

    ##
    # Admission Control (Hawkeye Protocol v2.0)
    # limit_conn: 10 concurrent requests per IP to prevent DOS/flooding
    # limit_req: 20 requests per second with burst of 50
    ##
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;
    limit_req_zone  $binary_remote_addr zone=req_limit:10m rate=50r/s; # Increased from 20r/s

    ##
    # Logging — buffered writes to reduce disk I/O and prevent ENOSPC
    ##
    access_log /var/log/nginx/access.log combined buffer=32k flush=1m;

    ##
    # Gzip Settings
    ##
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   4;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css
        application/json application/javascript
        text/xml application/xml application/xml+rss
        text/javascript application/wasm
        image/svg+xml;

    ##
    # Virtual Host Configs
    ##
    include /etc/nginx/conf.d/*.conf;
}
