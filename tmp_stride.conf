server {
    listen 80;
    server_name stride.deped.gov.ph;
    client_max_body_size 100M;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    server_name stride.deped.gov.ph;
    client_max_body_size 100M;

    ssl_certificate /etc/nginx/ssl/fullchain3.pem;
    ssl_certificate_key /etc/nginx/ssl/privatekey3.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers EECDH+AESGCM:EDH+AESGCM;

    # Upstream timeout — covers large PDF uploads through Hydra pipeline
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    # -----------------------------------------------------------------------
    # BLOCK: Legacy disk-based asset paths
    # All PDFs and images are stored in Postgres binary storage and served
    # exclusively through /api/asset/:id. Direct /uploads/ access is denied.
    # -----------------------------------------------------------------------
    location ^~ /uploads/ {
        return 410 '{"error":"Asset storage has migrated to Postgres binary. Use /api/asset/:id"}';
        add_header Content-Type application/json;
    }

    # -----------------------------------------------------------------------
    # 1. STRIDE Dashboard (Root) @ 3002
    # -----------------------------------------------------------------------
    location = / {
        if ($http_user_agent ~* "HealthProbe|Azure|LoadBalancer|TrafficManager") {
            return 200 'healthy';
        }
        proxy_pass http://localhost:3002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://localhost:3002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------------
    # 2. OpDash Frontend & API @ 3001
    # -----------------------------------------------------------------------
    location /opdash/ {
        alias /var/www/html/opdash/;
        try_files $uri $uri/ /opdash/index.html;
    }

    location /opdash/api/ {
        proxy_pass http://localhost:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------------
    # 3. Staging — Service Worker (no-cache)
    # -----------------------------------------------------------------------
    location /insighted-staging/sw.js {
        alias /var/www/html/InsightEd-Staging/dist/sw.js;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        proxy_no_cache 1;
    }

    # -----------------------------------------------------------------------
    # 3b. Staging Frontend @ 5001 (static assets served by nginx)
    # -----------------------------------------------------------------------
    location /insighted-staging/ {
        alias /var/www/html/InsightEd-Staging/dist/;
        try_files $uri $uri/ /insighted-staging/index.html;
    }

    # -----------------------------------------------------------------------
    # 3c. Staging API @ 5001
    # /api/asset/:id is the canonical binary asset endpoint — no disk reads.
    # -----------------------------------------------------------------------
    location /insighted-staging/api/ {
        proxy_pass http://localhost:5001/api/;
        client_max_body_size 100M;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 600s;
        client_body_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------------
    # 4. Production Frontend @ 5000 (static assets served by nginx)
    # -----------------------------------------------------------------------
    location /insighted/ {
        alias /var/www/html/InsightEd-Mobile-PWA/dist/;
        try_files $uri $uri/ /insighted/index.html;
    }

    # -----------------------------------------------------------------------
    # 4b. Production API @ 5000
    # -----------------------------------------------------------------------
    location /insighted/api/ {
        proxy_pass http://localhost:5000/api/;
        client_max_body_size 100M;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 600s;
        client_body_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------------
    # 5. Legacy/Generic API — redirect to Production @ 5000
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass http://localhost:5000/api/;
        client_max_body_size 100M;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 600s;
        client_body_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------------
    # Security: block hidden files (.env, .git, etc.)
    # -----------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
