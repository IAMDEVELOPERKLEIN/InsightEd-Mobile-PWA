# ============================================================
# stride.conf — Consolidated Asset Routing (Nginx)
# InsightEd PWA — stride.deped.gov.ph
#
# Architecture:
#   - ALL dynamic requests (/api/, /uploads/) → Express @ :5000
#   - Static SPA (/) → Express @ :5000 (serves React build)
#   - Staging (/insighted-staging) → Express @ :5001
#
# Key change from previous config:
#   - REMOVED location ^~ /uploads/ static alias
#   - /uploads/ now falls through to the root proxy block
#   - Express serves files from $UPLOAD_DIR via express.static
#   - Single source of truth: Express middleware, not Nginx disk paths
# ============================================================

server {
    listen 80 default_server;
    server_name stride.deped.gov.ph;

    # MIME types and global settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Allow large file uploads (PDFs, photos)
    client_max_body_size 500m;

    # ---------------------------------------------------------
    # 1. Staging Environment — /insighted-staging
    # ---------------------------------------------------------
    location /insighted-staging {
        alias /var/www/html/InsightEd-Staging/dist;
        index index.html;
        try_files $uri $uri/ /insighted-staging/index.html;
    }

    location /insighted-staging/api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ---------------------------------------------------------
    # 2. Production — All requests → Express @ :5000
    #
    #    This single block handles:
    #      /api/*        — Express API routes (including /api/asset/:id)
    #      /uploads/*    — Express static middleware (from $UPLOAD_DIR)
    #      /             — React SPA (index.html fallback)
    #
    #    No separate location ^~ /uploads/ block — Express owns it.
    # ---------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Generous timeouts for large file streams and PDF downloads
        proxy_connect_timeout 120s;
        proxy_read_timeout 300s;
        proxy_send_timeout 120s;
    }

    # ---------------------------------------------------------
    # 3. Security — deny hidden files (.env, .git, etc.)
    # ---------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
